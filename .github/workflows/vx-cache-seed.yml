name: vx-cache-seed
on:
  push:
  workflow_dispatch:

permissions: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: env inventory (names only)
        run: env | grep -iE '^(ACTIONS_|GITHUB_(TOKEN|ACTION|JOB|RUN|EVENT)|RUNNER)' | sed -E 's/=.*/=<set>/' | sort
      - run: |
          mkdir -p vxdir
          printf 'VX_CACHE_MARKER_20261001_C4C8\n' > vxdir/vx-marker.txt
      - uses: actions/cache/save@v4
        with:
          path: vxdir/vx-marker.txt
          key: vx-c4c8-cache-probe
      - uses: actions/upload-artifact@v4
        with:
          name: vx-foreign-artifact
          path: vxdir/vx-marker.txt
          retention-days: 1
      - name: self-probe cache via results Twirp (candidate versions)
        if: env.ACTIONS_RESULTS_URL != ''
        run: |
          RID="${{ github.repository_id }}"
          for v in \
            "$(printf 'vxdir/vx-marker.txt|zstd|1.0' | sha256sum | cut -d' ' -f1)" \
            "$(printf 'vxdir/vx-marker.txt|gzip|1.0' | sha256sum | cut -d' ' -f1)" \
            "$(printf 'vxdir/vx-marker.txt|zstd' | sha256sum | cut -d' ' -f1)" \
            "$(printf 'vxdir/vx-marker.txt|1.0' | sha256sum | cut -d' ' -f1)" ; do
            echo "=== version $v"
            curl -sS -m 8 -X POST \
              "${ACTIONS_RESULTS_URL}twirp/github.actions.results.api.v1.CacheService/GetCacheEntryDownloadURL" \
              -H "Authorization: Bearer ${ACTIONS_RUNTIME_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"metadata\":{\"repository_id\":\"${RID}\",\"scope\":[{\"scope\":\"refs/heads/main\",\"permission\":\"3\"}]},\"key\":\"vx-c4c8-cache-probe\",\"version\":\"${v}\",\"restore_keys\":[]}" | cut -c1-300
            echo
          done
